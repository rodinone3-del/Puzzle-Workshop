<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Puzzle Workshop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap">
<style>
/* Layout: one column workbench, 480px max. Hub = grid of machine cards; play = single board + control strip. */
:root{
  --bg:#e7e8e4; --panel:#f3f4f1; --panel2:#dcdedb; --ink:#1c262d; --mute:#5d6a72; --line:#c4c9c8;
  --accent:#17627f; --accent-ink:#ffffff; --brass:#b07d12; --good:#2c7a3f; --bad:#b3362b; --cell:#cfd3d1; --lamp:#f0b429;
  --c0:#d6453d; --c1:#2f7fd0; --c2:#e0a21b; --c3:#2f9e63; --c4:#8a4fc2; --c5:#1ea7a7; --c6:#e0679a; --c7:#6b6f73;
  --f-display:'Oswald','Arial Narrow',Impact,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181c; --panel:#1b2429; --panel2:#25313a; --ink:#e5ebee; --mute:#92a1aa; --line:#33414a;
  --accent:#4db3d6; --accent-ink:#0b1a21; --brass:#e0b04a; --good:#5fc07a; --bad:#ef7e72; --cell:#2a363e; --lamp:#f5c451;
  --c0:#ef6a60; --c1:#5a9ff0; --c2:#f0bb3e; --c3:#4cc888; --c4:#a97be0; --c5:#3fc7c7; --c6:#f088b4; --c7:#a3abb0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181c; --panel:#1b2429; --panel2:#25313a; --ink:#e5ebee; --mute:#92a1aa; --line:#33414a;
  --accent:#4db3d6; --accent-ink:#0b1a21; --brass:#e0b04a; --good:#5fc07a; --bad:#ef7e72; --cell:#2a363e; --lamp:#f5c451;
  --c0:#ef6a60; --c1:#5a9ff0; --c2:#f0bb3e; --c3:#4cc888; --c4:#a97be0; --c5:#3fc7c7; --c6:#f088b4; --c7:#a3abb0;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.02em;margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.brand{flex:0 0 auto;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;line-height:1;display:flex;flex-direction:column}
.brand small{font-family:var(--f-mono);font-weight:500;font-size:10px;letter-spacing:.18em;color:var(--mute);margin-top:4px}
.chip{flex:0 1 auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:0;max-width:62%}
.chip .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .sc{font-family:var(--f-mono);font-size:13px;color:var(--brass);font-weight:600;white-space:nowrap}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 auto}

/* hub */
.lead{color:var(--mute);margin:0}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover{border-color:var(--accent)}
.card .ico{height:54px;background:var(--panel2);border-radius:4px;display:grid;place-items:center;color:var(--ink)}
.card h3{font-size:19px;text-transform:uppercase}
.card p{margin:0;color:var(--mute);font-size:13px;line-height:1.35}
.card .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-mono);font-size:12px;gap:6px}
.card .meta b{color:var(--accent);font-weight:600}
.card .meta span{color:var(--brass)}
.footnav{display:flex;gap:10px}
.footnav .btn{flex:1}

/* screens */
.bar{display:flex;align-items:center;gap:10px;min-width:0}
.bar h2{font-size:22px;text-transform:uppercase;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .lv{font-family:var(--f-mono);color:var(--accent);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.lvl{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-mono);font-weight:600}
.lvl i{font-style:normal;font-size:11px;color:var(--brass);letter-spacing:.05em;min-height:14px}
.lvl.next{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.status{font-family:var(--f-mono);font-size:13px;color:var(--mute);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.status b{color:var(--ink);font-weight:600}
.hint{font-size:13px;color:var(--mute);margin:0}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}

/* grids */
.grid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;width:min(100%,420px);aspect-ratio:1}
.grid.flood{gap:2px}
.cell{border:0;border-radius:6px;background:var(--cell);padding:0;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;color:var(--ink);min-width:0}
.lamp{transition:background .12s,box-shadow .12s}
.lamp.on{background:var(--lamp);box-shadow:0 0 14px color-mix(in srgb,var(--lamp) 60%,transparent)}
.tile{font-family:var(--f-display);font-size:clamp(18px,7vw,30px);background:var(--panel2);border:1px solid var(--line);border-bottom-width:3px}
.tile.ok{color:var(--accent)}
.tile.blank{background:transparent;border:1px dashed var(--line)}
.fcell{border-radius:2px;font-size:clamp(7px,2.4vw,12px);color:rgb(0 0 0 / .45)}
.pal{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sw{width:46px;height:46px;border-radius:8px;border:2px solid transparent;font-family:var(--f-mono);font-weight:700;color:rgb(0 0 0 / .5);font-size:16px;display:grid;place-items:center}
.sw[disabled]{opacity:.35}
.sw.cur{border-color:var(--ink)}

/* code breaker */
.hist{display:flex;flex-direction:column;gap:6px;width:min(100%,420px)}
.guess{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:6px;padding:6px 8px;min-height:50px}
.guess .slots{display:flex;gap:6px;flex:1}
.slot{width:36px;height:36px;border-radius:50%;background:var(--cell);border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:14px;color:rgb(0 0 0 / .5);padding:0}
.slot.f{border:2px solid transparent}
.slot.sel{border-color:var(--accent)}
.pegs{display:grid;grid-template-columns:repeat(3,12px);gap:3px;width:48px;justify-content:center}
.peg{width:12px;height:12px;border-radius:50%;background:var(--line)}
.peg.b{background:var(--ink)}
.peg.w{background:transparent;border:2px solid var(--ink)}
.guess.cur{background:var(--panel);border:1px solid var(--accent)}

/* sequences */
.seq{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.term{min-width:50px;padding:10px 8px;text-align:center;background:var(--panel2);border-radius:6px;font-family:var(--f-mono);font-weight:600;font-size:18px}
.term.q{background:var(--accent);color:var(--accent-ink)}
.ans{display:flex;gap:8px;width:min(100%,320px)}
.ans input{flex:1;min-width:0;font:inherit;font-family:var(--f-mono);font-size:20px;padding:10px;border-radius:6px;border:2px solid var(--line);background:var(--panel);color:var(--ink);text-align:center}
.ans input.bad{border-color:var(--bad)}
.msg{min-height:22px;text-align:center;font-size:14px}
.msg.bad{color:var(--bad)}.msg.good{color:var(--good)}

/* latin */
.lat{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;width:min(100%,380px);aspect-ratio:1;background:var(--line);padding:3px;border-radius:8px}
.lc{border:0;border-radius:4px;background:var(--panel);font-family:var(--f-display);font-size:clamp(20px,7vw,30px);font-weight:600;display:grid;place-items:center;padding:0;min-width:0}
.lc.given{background:var(--panel2);color:var(--ink)}
.lc.user{color:var(--accent)}
.lc.sel{outline:3px solid var(--accent);outline-offset:-3px}
.lc.conf{background:color-mix(in srgb,var(--bad) 28%,var(--panel));color:var(--bad)}
.numpad{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.numpad .btn{min-width:44px;padding:8px 0;font-family:var(--f-display);font-size:20px}

/* shape conveyor */
.bstage{position:relative;width:100%;max-width:440px;height:310px;overflow:hidden;border-radius:8px;background:var(--panel2);touch-action:none;user-select:none;-webkit-user-select:none}
.belt-bar{position:absolute;left:0;right:0;top:14px;height:76px;background:var(--bg);border-block:3px solid var(--line);
  background-image:repeating-linear-gradient(90deg,transparent 0 22px,color-mix(in srgb,var(--line) 70%,transparent) 22px 26px);animation:beltmove .9s linear infinite}
@keyframes beltmove{to{background-position:26px 0}}
.bp{position:absolute;left:0;top:0;width:48px;height:48px;cursor:grab;touch-action:none;will-change:transform;z-index:2}
.bp.sel{filter:drop-shadow(0 0 0 var(--ink)) drop-shadow(0 0 5px var(--accent))}
.bp.drag{cursor:grabbing;z-index:6;filter:drop-shadow(0 6px 6px rgb(0 0 0 / .35))}
.bp svg,.hsvg svg{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
.pg{stroke:rgb(0 0 0 / .28);stroke-width:2}
.holes{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;justify-content:center;z-index:1}
.hole{flex:1 1 0;max-width:84px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.hsvg{width:min(100%,56px);aspect-ratio:1}
.hg{fill:color-mix(in srgb,var(--hc) 20%,transparent);stroke:var(--hc);stroke-width:2.5;stroke-dasharray:4 3}
.hole.full .hg{fill:var(--hc);stroke:rgb(0 0 0 / .28);stroke-width:2;stroke-dasharray:none}
.hole.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,var(--panel))}
.hole.ok{border-color:var(--good)}
.pips{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--mute);white-space:nowrap}

/* words */
.wgrid{display:grid;grid-template-columns:repeat(var(--len),1fr);gap:5px;width:min(100%,calc(var(--len)*58px))}
.wt{aspect-ratio:1;border:2px solid var(--line);border-radius:4px;background:var(--panel);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:clamp(20px,7vw,30px);text-transform:uppercase;min-width:0}
.wt.f{border-color:var(--ink)}
.wt.t2,.wt.t1,.wt.t0{color:var(--accent-ink);border-color:transparent}
.wt.t2{background:var(--good)}
.wt.t1{background:var(--brass);border-radius:14px}
.wt.t0{background:var(--mute)}
.kb{display:flex;flex-direction:column;gap:5px;width:100%;max-width:440px}
.kr{display:flex;gap:4px;justify-content:center}
.key{flex:1 1 0;min-width:0;height:46px;padding:0;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font-family:var(--f-display);font-size:18px;font-weight:500;text-transform:uppercase}
.key.k2{background:var(--good);color:var(--accent-ink);border-color:transparent}
.key.k1{background:var(--brass);color:var(--accent-ink);border-color:transparent}
.key.k0{background:var(--line);color:var(--mute)}
.key.wide{flex:1.6 1 0}

/* word chain */
.wchain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;min-height:54px;width:100%}
.wchain .ph{color:var(--mute);font-size:14px}
.wchain .ar{color:var(--mute);font-family:var(--f-mono)}
.wpool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.wchip{font-family:var(--f-body);font-weight:500;font-size:16px;padding:9px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);min-height:44px;color:var(--ink)}
.wchip b{color:var(--accent);font-weight:700;text-transform:uppercase}
.wchip[disabled]{opacity:.38;cursor:not-allowed}
.wchain .wchip{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-height:0;padding:6px 10px;cursor:default}
.wchain .wchip b{color:var(--accent-ink);text-decoration:underline}

/* crossword */
.xclue{width:100%;max-width:440px;background:var(--panel2);border-radius:6px;padding:9px 12px;font-size:14px;min-height:58px}
.xclue b{font-family:var(--f-mono);color:var(--accent)}
.xgrid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:2px;width:min(100%,calc(var(--cols)*40px))}
.xc{aspect-ratio:1;position:relative;border:0;border-radius:3px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--f-display);font-weight:600;font-size:clamp(14px,4.6vw,22px);text-transform:uppercase;padding:0;display:grid;place-items:center;color:var(--ink);min-width:0}
.xc.blk{background:transparent;box-shadow:none;pointer-events:none}
.xc.in{background:color-mix(in srgb,var(--accent) 30%,var(--panel2))}
.xc.sel{background:var(--accent);color:var(--accent-ink)}
.xc.bad{color:var(--bad);outline:2px solid var(--bad);outline-offset:-2px}
.xc i{position:absolute;left:2px;top:0;font-family:var(--f-mono);font-size:9px;font-style:normal;font-weight:600;color:var(--mute);line-height:1.2}
.xc.sel i{color:var(--accent-ink)}
.xlists{display:grid;grid-template-columns:1fr;gap:12px;width:100%}
.xlists h3{font-size:15px;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.xl{display:flex;flex-direction:column;gap:3px}
.xcl{text-align:left;background:transparent;border:0;border-radius:4px;padding:6px 8px;font-size:14px;line-height:1.35}
.xcl b{font-family:var(--f-mono);color:var(--accent);margin-right:4px}
.xcl.cur{background:color-mix(in srgb,var(--accent) 22%,var(--panel))}
@media (min-width:520px){.xlists{grid-template-columns:1fr 1fr}}

/* leaderboard */
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.lb li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel2);border-radius:6px;padding:9px 10px}
.lb li.me{background:var(--accent);color:var(--accent-ink)}
.lb .rk{font-family:var(--f-mono);font-weight:600;text-align:center}
.lb li:nth-child(-n+3) .rk{color:var(--brass);font-size:17px}
.lb li.me .rk{color:inherit}
.lb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lb .nm small{display:block;font-weight:400;font-size:12px;opacity:.75}
.lb .pt{font-family:var(--f-mono);font-weight:600}

/* overlay */
.ovl{position:fixed;inset:0;background:rgb(10 16 20 / .62);display:grid;place-items:center;padding:16px;z-index:20}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;width:min(100%,380px);display:flex;flex-direction:column;gap:14px;text-align:center}
.dlg h2{font-size:28px;text-transform:uppercase}
.dlg .stars{font-size:40px;letter-spacing:.12em;color:var(--brass)}
.dlg .stars .off{color:var(--line)}
.dlg input{font:inherit;font-size:18px;padding:12px;border-radius:6px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
.dlg .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:-6px}
.note{font-size:12px;color:var(--mute);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>const LOGIC=(()=>{
'use strict';
/* Puzzle Works: pure game logic (generators, solvers, scoring). No DOM here. */

function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^h>>>16)>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rngFor=(type,level,nonce)=>mulberry32(hashStr(type+':'+level+':'+(nonce||0)));
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const range=n=>Array.from({length:n},(_,i)=>i);

const TYPES=['lights','slide','flood','code','seq','latin','belt','word','chain','cross'];
const ptsFor=(level,stars)=>stars*(40+8*level);
function totalScore(stars){let t=0;for(const k of TYPES){const s=(stars&&stars[k])||'';for(let i=0;i<s.length;i++){const v=+s[i];if(v>0)t+=ptsFor(i+1,v);}}return t;}
function levelsSolved(stars){let c=0;for(const k of TYPES){const s=(stars&&stars[k])||'';for(let i=0;i<s.length;i++)if(+s[i]>0)c++;}return c;}

/* ---------- Lights ---------- */
const lightsSize=l=>l<=3?3:l<=8?4:l<=16?5:l<=28?6:7;
function lightsToggle(b,n,i){const r=(i/n)|0,c=i%n;b[i]^=1;if(r>0)b[i-n]^=1;if(r<n-1)b[i+n]^=1;if(c>0)b[i-1]^=1;if(c<n-1)b[i+1]^=1;}
function lightsGen(level){
  const rng=rngFor('lights',level),n=lightsSize(level);
  const k=Math.min(Math.floor(n*n*0.6),2+Math.floor(level/2));
  for(;;){
    const presses=shuffle(rng,range(n*n)).slice(0,k);
    const board=new Array(n*n).fill(0);
    for(const p of presses)lightsToggle(board,n,p);
    if(board.some(x=>x))return{n,board,par:k,presses};
  }
}
const lightsStars=(moves,par)=>moves<=par?3:moves<=Math.ceil(par*1.6)+2?2:1;

/* ---------- Sliding tiles ---------- */
const slideSize=l=>l<=8?3:l<=22?4:5;
function slideNeighbors(i,n){const r=(i/n)|0,c=i%n,o=[];if(r>0)o.push(i-n);if(r<n-1)o.push(i+n);if(c>0)o.push(i-1);if(c<n-1)o.push(i+1);return o;}
function slideGen(level){
  const rng=rngFor('slide',level),n=slideSize(level);
  let walk=n===3?10+level*4:n===4?30+(level-8)*3:70+(level-22)*2;
  walk=Math.min(walk,220);
  const t=range(n*n).map(i=>(i+1)%(n*n));
  let blank=n*n-1,last=-1;

      if(rec(i+1))return true;

const CLUES=(()=>{
  const out=[],seen=new Set();
  for(const line of CLUE_RAW.split('\n')){
    const i=line.indexOf('|');if(i<0)continue;
    const w=line.slice(0,i).trim(),c=line.slice(i+1).trim();

    if(!/^[абвгґдеєжзиіїйклмнопрстуфхцчшщьюя]+$/.test(w))continue;
    seen.add(w);out.push({w,c});

function crossCanPlace(grid,mask,G,word,r,c,d,needCross){
  const dr=d?1:0,dc=d?0:1,len=word.length;
  if(r<0||c<0||r+dr*(len-1)>=G||c+dc*(len-1)>=G)return false;
  const at=(y,x)=>(y>=0&&x>=0&&y<G&&x<G)?grid[y*G+x]:'';
  if(at(r-dr,c-dc)||at(r+dr*len,c+dc*len))return false;
  let cross=0;
  for(let i=0;i<len;i++){
    const y=r+dr*i,x=c+dc*i,cell=grid[y*G+x];
    if(cell){
      if(cell!==word[i]||(mask[y*G+x]&(1<<d)))return false;
      cross++;
    }else{
      if(at(y-dc,x-dr)||at(y+dc,x+dr))return false;
    }
  }
  return needCross?cross>=1:cross===0;
}
function crossBuild(r,G,target){
  const grid=new Array(G*G).fill(''),mask=new Array(G*G).fill(0),placed=[],used=new Set();
  const put=(word,y,x,d)=>{
    const dr=d?1:0,dc=d?0:1;
    for(let i=0;i<word.length;i++){grid[(y+dr*i)*G+x+dc*i]=word[i];mask[(y+dr*i)*G+x+dc*i]|=1<<d;}
    placed.push({w:word,r:y,c:x,d});used.add(word);
  };
  const pool=shuffle(r,CLUES.map(x=>x.w));
  const first=pool.find(w=>w.length>=5&&w.length<=Math.min(G-2,7))||pool[0];
  put(first,(G/2)|0,Math.max(0,((G-first.length)/2)|0),0);
  let stuck=0;
  while(placed.length<target&&stuck<3){
    let progress=false;
    for(const w of shuffle(r,pool)){
      if(placed.length>=target)break;
      if(used.has(w))continue;
      const opts=[];
      for(let d=0;d<2;d++){
        const dr=d?1:0,dc=d?0:1;
        for(let i=0;i<w.length;i++)for(let y=0;y<G;y++)for(let x=0;x<G;x++){
          if(grid[y*G+x]!==w[i])continue;
          const sy=y-dr*i,sx=x-dc*i;

function crossGen(level,nonce){

/* ---------- state & persistence ---------- */
const LS='pw.v1';
const S={name:'',stars:{},pushed:0,nameDirty:false,uid:null,db:null,dbok:false,board:[],boardState:'wait',sync:'',
  screen:'hub',type:null,level:1,showAll:false,retry:0};
const clean=o=>{const out={};for(const t of TYPES){const s=String((o&&o[t])||'').replace(/[^0-3]/g,'');out[t]=s;}return out;};
const merge=(a,b)=>{const out={};for(const t of TYPES){const x=(a&&a[t])||'',y=(b&&b[t])||'';const n=Math.max(x.length,y.length);let s='';for(let i=0;i<n;i++)s+=Math.max(+x[i]||0,+y[i]||0);out[t]=s;}return out;};
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'{}');S.name=String(j.name||'').slice(0,16);S.stars=clean(j.stars);S.pushed=+j.pushed||0;}catch(e){S.stars=clean({});}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({name:S.name,stars:S.stars,pushed:S.pushed}));}catch(e){}}
const score=()=>totalScore(S.stars);
const starsOf=(t,l)=>+((S.stars[t]||'')[l-1])||0;
const solvedCount=t=>(S.stars[t]||'').length;
function addStars(t,l,st){
  let s=S.stars[t]||'';while(s.length<l)s+='0';
  const old=+s[l-1]||0;
  if(st>old){s=s.slice(0,l-1)+st+s.slice(l);S.stars[t]=s;saveLocal();syncRemote();return ptsFor(l,st)-(old?ptsFor(l,old):0);}
  S.stars[t]=s;saveLocal();return 0;
}

let syncTimer=0,pushing=false,pushAgain=false;
function syncRemote(){if(!S.dbok)return;clearTimeout(syncTimer);syncTimer=setTimeout(doSync,500);}
async function doSync(){
  if(!S.dbok)return;
  if(pushing){pushAgain=true;return;}
  pushing=true;
  try{
    const sc=score();
    await S.db.doc('data/users/'+S.uid+'/profile').set({name:S.name,stars:S.stars,updated:Date.now()});
    if(S.name&&sc>0&&(sc>S.pushed||S.nameDirty)){
      await S.db.doc('board/'+S.uid).set({name:S.name,score:sc,levels:levelsSolved(S.stars),updated:Date.now()});
      S.pushed=sc;S.nameDirty=false;saveLocal();
    }
    S.sync='ok';
  }catch(e){S.sync='err';}
  pushing=false;
  if(S.screen==='board')render();
  if(pushAgain){pushAgain=false;doSync();}
}
async function initDb(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id();
    if(!uid)return;
    S.db=db;S.uid=uid;
    const snap=await db.doc('data/users/'+uid+'/profile').get();
    if(snap.exists){
      const d=snap.data()||{};
      S.stars=merge(S.stars,clean(d.stars));
      if(!S.name&&d.name)S.name=String(d.name).slice(0,16);
      saveLocal();
    }
    S.dbok=true;
    db.collection('board').orderBy('score','desc').limit(50).onSnapshot(q=>{
      S.board=q.docs.map(d=>Object.assign({id:d.id},d.data()));S.boardState='ok';
      if(S.screen==='board')render();
    },()=>{S.boardState='err';if(S.screen==='board')render();});
    if(S.name&&S.stars&&(score()>0))syncRemote();

}

/* ---------- screens ---------- */

  if(S.screen==='play')return renderPlay();
}
function topbar(){

}

    })),

function renderType(){

    btns.push(h('button',{class:'lvl'+(l===next?' next':''),onclick:()=>go('play',{level:l,retry:0})},l,h('i',l===next?'грати':starsText(st))));

function renderBoard(){

  app.append(
    h('div',{class:'bar'},h('button',{class:'btn',onclick:()=>go('hub'),'aria-label':'Назад'},'←'),h('h2','Лідерборд')),
    h('div',{class:'panel'},body,
      S.sync==='err'?h('p',{class:'hint'},'Результат не вдалося записати в лідерборд. Для запису потрібен доступ рівня Contributor.'):null,
      h('div',{class:'status'},h('span','Твій результат: ',h('b',score()+' оч.')),
        h('span',inTop?'ти в топ-50':(S.uid?'поза топ-50':'тільки локально')))));

/* ---------- play ---------- */
let statusEl=null;
function renderPlay(){
  const t=S.type,l=S.level,m=META[t];
  statusEl=h('div',{class:'status'});
  const stage=h('div',{class:'stage'});
  app.append(
    h('div',{class:'bar'},h('button',{class:'btn',onclick:()=>go('type'),'aria-label':'До рівнів'},'←'),

    h('div',{class:'row'},
      h('button',{class:'btn',onclick:()=>{S.retry++;render();}},st<3?'Покращити':'Ще раз'),

/* ---------- name dialog ---------- */
function askName(editing){
  const input=h('input',{id:'name-in',type:'text',maxlength:'16',value:S.name,placeholder:'Твоє імʼя',autocomplete:'nickname','aria-label':'Імʼя гравця'});

    const changed=v!==S.name;
    S.name=v;if(changed)S.nameDirty=true;saveLocal();syncRemote();

  };

    h('h2',editing?'Твоє імʼя':'Ласкаво просимо'),

/* ---------- games ---------- */
const GAMES={};
const st=(label,val)=>h('span',label+' ',h('b',val));

GAMES.lights=(el,level,ctx)=>{
  const g=LOGIC.lightsGen(level),n=g.n;
  const b=g.board.slice();let moves=0,done=false;
  const cells=b.map((_,i)=>h('button',{class:'cell lamp','aria-label':'Лампа '+(i+1),onclick:()=>tap(i)}));
  el.append(h('div',{class:'grid',style:'--n:'+n},cells),h('p',{class:'hint'},'Ціль: за '+g.par+' ходів або менше, щоб отримати три зірки.'));
  function paint(){cells.forEach((c,i)=>c.classList.toggle('on',!!b[i]));ctx.status([st('Ходи:',moves),st('Горить:',b.reduce((a,x)=>a+x,0))]);}
  function tap(i){
    if(done)return;
    LOGIC.lightsToggle(b,n,i);moves++;paint();
    if(!b.some(x=>x)){done=true;setTimeout(()=>ctx.win(LOGIC.lightsStars(moves,g.par),'Ходів: '+moves+', ціль '+g.par),250);}
  }
  paint();
};

GAMES.slide=(el,level,ctx)=>{
  const g=LOGIC.slideGen(level),n=g.n,t=g.tiles.slice();let moves=0,done=false;
  const grid=h('div',{class:'grid',style:'--n:'+n});
  el.append(grid,h('p',{class:'hint'},'Торкнись плитки в одному рядку чи стовпці з порожньою клітинкою.'));
  function paint(){
    grid.replaceChildren(...t.map((v,i)=>v===0?h('div',{class:'cell tile blank'}):
      h('button',{class:'cell tile'+(v===((i+1)%(n*n))?' ok':''),onclick:()=>tap(i)},v)));
    ctx.status([st('Ходи:',moves),st('Орієнтир:',g.par)]);
  }
  function tap(i){
    if(done)return;
    const b=t.indexOf(0),r=(i/n)|0,c=i%n,br=(b/n)|0,bc=b%n;
    if(r!==br&&c!==bc)return;

    let cur=b;
    while(cur!==i){t[cur]=t[cur+step];cur+=step;moves++;}
    t[i]=0;paint();
    if(LOGIC.slideSolved(t,n)){done=true;setTimeout(()=>ctx.win(LOGIC.slideStars(moves,g.par),'Ходів: '+moves),250);}
  }
  paint();
};

  const g=LOGIC.floodGen(level),n=g.n,grid=g.grid.slice();let moves=0,done=false;

  function paint(){
    gridEl.replaceChildren(...grid.map(v=>h('div',{class:'cell fcell',style:'background:var(--c'+v+')'},GLYPH[v])));
    pal.replaceChildren(...Array.from({length:g.K},(_,c)=>h('button',{class:'sw'+(c===grid[0]?' cur':''),style:'background:var(--c'+c+')',
      'aria-label':'Колір '+(c+1),disabled:c===grid[0]||done,onclick:()=>pick(c)},GLYPH[c])));
    ctx.status([st('Ходи:',moves+' / '+g.limit),st('Для трьох зірок:',g.greedy)]);
  }
  function pick(c){
    if(done)return;
    LOGIC.floodApply(grid,n,c);moves++;paint();
    if(LOGIC.floodDone(grid)){done=true;paint();setTimeout(()=>ctx.win(LOGIC.floodStars(moves,g.greedy,g.slack),'Ходів: '+moves+' із '+g.limit),250);}
    else if(moves>=g.limit){done=true;paint();setTimeout(()=>ctx.lose('Ходи закінчилися. Ліміт на цьому рівні: '+g.limit+'.'),250);}

GAMES.code=(el,level,ctx)=>{
  const g=LOGIC.codeGen(level,S.retry),L=g.L;
  const hist=[];let cur=Array(L).fill(null),sel=0,done=false;
  const histEl=h('div',{class:'hist'}),pal=h('div',{class:'pal'});
  const submit=h('button',{class:'btn primary',onclick:send},'Перевірити');
  el.append(histEl,pal,submit,h('p',{class:'hint'},(g.repeats?'Кольори можуть повторюватись.':'Кожен колір у коді зустрічається не більше разу.')+' Темна крапка: правильний колір на своєму місці. Контурна: колір є, але місце інше.'));
  const slotEl=(v,extra,on)=>h('button',{class:'slot'+(v!=null?' f':'')+(extra||''),style:v!=null?'background:var(--c'+v+')':'',onclick:on,'aria-label':'Слот'},v!=null?GLYPH[v]:'');
  function pegs(fb){
    const p=[];for(let i=0;i<fb.black;i++)p.push(h('span',{class:'peg b'}));
    for(let i=0;i<fb.white;i++)p.push(h('span',{class:'peg w'}));
    while(p.length<L)p.push(h('span',{class:'peg'}));
    return h('div',{class:'pegs'},p.slice(0,L<=3?3:6));
  }
  function paint(){
    const rows=hist.map(x=>h('div',{class:'guess'},h('div',{class:'slots'},x.g.map(v=>slotEl(v,' f'))),pegs(x.fb)));
    if(!done)rows.push(h('div',{class:'guess cur'},h('div',{class:'slots'},cur.map((v,i)=>slotEl(v,i===sel?' sel':'',()=>{if(cur[i]!=null){cur[i]=null;}sel=i;paint();}))),h('div',{class:'pegs'})));
    histEl.replaceChildren(...rows);
    pal.replaceChildren(...Array.from({length:g.K},(_,c)=>h('button',{class:'sw',style:'background:var(--c'+c+')','aria-label':'Колір '+(c+1),disabled:done,onclick:()=>put(c)},GLYPH[c])));
    submit.disabled=done||cur.some(v=>v==null);
    ctx.status([st('Спроба:',Math.min(hist.length+1,g.attempts)+' / '+g.attempts),st('Позицій:',L)]);
  }
  function put(c){
    let i=cur[sel]==null?sel:cur.findIndex(v=>v==null);
    if(i<0)i=sel;
    cur[i]=c;
    const nx=cur.findIndex(v=>v==null);sel=nx<0?i:nx;paint();
  }
  function send(){
    if(done||cur.some(v=>v==null))return;
    const fb=LOGIC.codeFeedback(g.secret,cur);
    hist.push({g:cur.slice(),fb});cur=Array(L).fill(null);sel=0;
    if(fb.black===L){done=true;paint();setTimeout(()=>ctx.win(LOGIC.codeStars(hist.length,g.attempts),'Спроб: '+hist.length+' із '+g.attempts),300);return;}
    if(hist.length>=g.attempts){done=true;paint();
      setTimeout(()=>ctx.lose('Спроби закінчилися. Код був: '+g.secret.map(v=>GLYPH[v]).join(' ')+'. Наступна спроба матиме новий код.'),300);return;}
    paint();
  }
  paint();
};

GAMES.seq=(el,level,ctx)=>{
  const qs=LOGIC.seqGen(level,S.retry);let qi=0,tries=0,mistakes=0,busy=false;
  const seqEl=h('div',{class:'seq'}),msg=h('div',{class:'msg'});
  const input=h('input',{id:'seq-in',type:'text',inputmode:'numeric',autocomplete:'off','aria-label':'Відповідь',onkeydown:e=>{if(e.key==='Enter')check();}});
  const sign=h('button',{class:'btn',onclick:()=>{const v=input.value.trim();input.value=v.startsWith('-')?v.slice(1):'-'+v;input.focus();},'aria-label':'Змінити знак'},'±');
  const ok=h('button',{class:'btn primary',onclick:check},'Перевірити');
  el.append(seqEl,h('div',{class:'ans'},sign,input,ok),msg,h('p',{class:'hint'},'Три запитання на рівень. Помилка — це зайва спроба, а не кінець.'));
  function paint(){
    const q=qs[qi];
    seqEl.replaceChildren(...q.terms.map((v,i)=>h('div',{class:'term'+(i===q.hidden?' q':'')},i===q.hidden?'?':v)));
    input.value='';input.classList.remove('bad');
    ctx.status([st('Запитання:',(qi+1)+' / 3'),st('Помилок:',mistakes)]);
  }
  function advance(){
    qi++;tries=0;msg.textContent='';msg.className='msg';busy=false;
    if(qi>=3){ctx.win(mistakes===0?3:mistakes<=2?2:1,'Помилок: '+mistakes);return;}
    paint();input.focus();
  }
  function check(){
    if(busy)return;
    const raw=input.value.trim().replace('−','-');
    if(!/^-?\d+$/.test(raw)){msg.className='msg bad';msg.textContent='Введи ціле число.';return;}
    const q=qs[qi];
    if(+raw===q.answer){
      busy=true;msg.className='msg good';msg.textContent='Вірно: '+q.rule+'.';setTimeout(advance,1300);
    }else{
      mistakes++;tries++;input.classList.add('bad');
      if(tries>=3){busy=true;msg.className='msg bad';msg.textContent='Відповідь: '+q.answer+'. Правило: '+q.rule+'.';ctx.status([st('Запитання:',(qi+1)+' / 3'),st('Помилок:',mistakes)]);setTimeout(advance,2600);}
      else{msg.className='msg bad';msg.textContent='Ні, спробуй ще. Залишилось спроб: '+(3-tries)+'.';ctx.status([st('Запитання:',(qi+1)+' / 3'),st('Помилок:',mistakes)]);}
    }
  }
  paint();
};

GAMES.latin=(el,level,ctx)=>{
  const g=LOGIC.latinGen(level),n=g.n,cells=g.puzzle.slice();let sel=-1,mistakes=0,done=false;
  const grid=h('div',{class:'lat',style:'--n:'+n}),pad=h('div',{class:'numpad'});
  el.append(grid,pad,h('p',{class:'hint'},'Обери клітинку, потім цифру. У кожного рядка й стовпця — усі цифри від 1 до '+n+'.'));
  function conflicts(){
    const bad=new Set();
    for(let i=0;i<n*n;i++){
      if(!cells[i])continue;const r=(i/n)|0,c=i%n;
      for(let j=0;j<n;j++){
        const a=r*n+j,b=j*n+c;
        if(a!==i&&cells[a]===cells[i]){bad.add(i);bad.add(a);}
        if(b!==i&&cells[b]===cells[i]){bad.add(i);bad.add(b);}
      }
    }
    return bad;
  }
  function paint(){
    const bad=conflicts();
    grid.replaceChildren(...cells.map((v,i)=>h('button',{class:'lc'+(g.puzzle[i]?' given':v?' user':'')+(i===sel?' sel':'')+(bad.has(i)?' conf':''),
      onclick:()=>{if(!done&&!g.puzzle[i]){sel=i;paint();}},'aria-label':'Клітинка '+(i+1)},v||'')));
    pad.replaceChildren(...Array.from({length:n},(_,k)=>h('button',{class:'btn',disabled:done,onclick:()=>put(k+1)},k+1)),
      h('button',{class:'btn',disabled:done,onclick:()=>put(0),'aria-label':'Стерти'},'⌫'));
    ctx.status([st('Помилок:',mistakes),st('Порожніх:',cells.filter(v=>!v).length)]);
  }
  function put(v){
    if(done||sel<0||g.puzzle[sel])return;
    if(v&&v!==cells[sel]&&v!==g.solution[sel])mistakes++;
    cells[sel]=v;paint();
    if(cells.every((x,i)=>x===g.solution[i])){done=true;sel=-1;paint();setTimeout(()=>ctx.win(LOGIC.latinStars(mistakes),'Помилок: '+mistakes),300);}
  }
  const key=e=>{
    if(e.target&&e.target.tagName==='INPUT')return;
    if(e.key>='1'&&e.key<=String(n))put(+e.key);
    else if(e.key==='Backspace'||e.key==='Delete'||e.key==='0')put(0);
    else if(sel>=0&&e.key.startsWith('Arrow')){
      const d={ArrowLeft:-1,ArrowRight:1,ArrowUp:-n,ArrowDown:n}[e.key];let s=sel+d;
      if(s>=0&&s<n*n&&!(d===-1&&sel%n===0)&&!(d===1&&sel%n===n-1)){sel=s;paint();}
    }
  };
  document.addEventListener('keydown',key);ctx.cleanup(()=>document.removeEventListener('keydown',key));
  paint();
};

/* ---------- shape conveyor ---------- */
const SHAPE_NAME={circle:'коло',triangle:'трикутник',square:'квадрат',star:'зірка',hexagon:'шестикутник',diamond:'ромб',cross:'хрест',pentagon:'пʼятикутник'};
const COLOR_NAME=['червоний','синій','жовтий','зелений','фіолетовий','бірюзовий'];
function polyPts(n,r,rot,ri){
  const pts=[],m=ri?n*2:n;
  for(let i=0;i<m;i++){const rad=(ri&&i%2)?ri:r,a=(rot+i*360/m)*Math.PI/180;pts.push((20+rad*Math.cos(a)).toFixed(1)+','+(20+rad*Math.sin(a)).toFixed(1));}
  return pts.join(' ');
}
function shapeMarkup(s){
  switch(s){
    case 'circle':return '<circle cx="20" cy="20" r="16"/>';
    case 'triangle':return '<polygon points="20,4 36,34 4,34"/>';
    case 'square':return '<rect x="5" y="5" width="30" height="30" rx="3"/>';
    case 'star':return '<polygon points="'+polyPts(5,18,-90,7.6)+'"/>';
    case 'hexagon':return '<polygon points="'+polyPts(6,17,0)+'"/>';
    case 'diamond':return '<polygon points="20,3 36,20 20,37 4,20"/>';
    case 'cross':return '<polygon points="14,4 26,4 26,14 36,14 36,26 26,26 26,36 14,36 14,26 4,26 4,14 14,14"/>';
    default:return '<polygon points="'+polyPts(5,17,-90)+'"/>';
  }
}
const shapeSvg=(shape,col,hole)=>'<svg viewBox="0 0 40 40" aria-hidden="true"><g class="'+(hole?'hg':'pg')+'"'+(hole?'':' style="fill:var(--c'+col+')"')+'>'+shapeMarkup(shape)+'</g></svg>';

GAMES.belt=(el,level,ctx)=>{
  const g=LOGIC.beltGen(level,S.retry);
  const SIZE=48,GAP=Math.round(SIZE*1.5),BELT_Y=28;
  const stage=h('div',{class:'bstage'}),holesRow=h('div',{class:'holes'});
  stage.append(h('div',{class:'belt-bar'}));
  const holes=g.types.map((t,i)=>{
    const node=h('div',{class:'hole',role:'button',tabindex:'0','data-k':t.shape+':'+t.color,style:'--hc:var(--c'+t.color+')',
      'aria-label':SHAPE_NAME[t.shape]+', '+COLOR_NAME[t.color]});
    const hs=h('div',{class:'hsvg'}),pips=h('div',{class:'pips'});
    hs.innerHTML=shapeSvg(t.shape,t.color,true);
    node.append(hs,pips);
    const o={shape:t.shape,color:t.color,need:t.need,n:0,node,pips};
    node.addEventListener('click',()=>{if(sel&&!done)tryPlace(sel,i);});
    node.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&sel&&!done){e.preventDefault();tryPlace(sel,i);}});
    holesRow.append(node);
    return o;
  });
  stage.append(holesRow);
  el.append(stage,h('p',{class:'hint'},'Перетягни фігуру в отвір такої ж форми'+(g.useColor?' і такого ж кольору':'')+'. Можна й торкнутися фігури, а потім отвору.'));
  let W=stage.clientWidth||400,done=false,sel=null,drag=null,mistakes=0,remaining=g.pieces.length,tLeft=g.time,shiftT=0,lastShown=-1,raf=0,last=performance.now();
  const n0=g.pieces.length;
  const pcs=g.pieces.map((p,i)=>{
    const node=h('div',{class:'bp','data-k':p.shape+':'+p.color,'aria-label':SHAPE_NAME[p.shape]+', '+COLOR_NAME[p.color]});
    node.innerHTML=shapeSvg(p.shape,p.color,false);
    const o={shape:p.shape,color:p.color,off:i*GAP,el:node,drag:false,done:false};
    node.addEventListener('pointerdown',e=>{
      if(done||o.done)return;
      e.preventDefault();
      try{node.setPointerCapture(e.pointerId);}catch(_){}
      drag={p:o,sx:e.clientX,sy:e.clientY,moved:false,id:e.pointerId};
    });
    node.addEventListener('pointermove',e=>{
      if(!drag||drag.p!==o||e.pointerId!==drag.id)return;
      if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<7)return;
      drag.moved=true;o.drag=true;node.classList.add('drag');
      const r=stage.getBoundingClientRect();
      place(o,e.clientX-r.left-SIZE/2,e.clientY-r.top-SIZE/2);
    });
    node.addEventListener('pointerup',e=>{
      if(!drag||drag.p!==o)return;
      const d=drag;drag=null;o.drag=false;node.classList.remove('drag');
      if(!d.moved){select(o);return;}
      const hi=holeAt(e.clientX,e.clientY);
      if(hi>=0)tryPlace(o,hi);
    });
    node.addEventListener('pointercancel',()=>{if(drag&&drag.p===o){drag=null;o.drag=false;node.classList.remove('drag');}});
    stage.append(node);
    place(o,-SIZE*2,BELT_Y);
    return o;
  });
  function place(p,x,y){p.el.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)';}
  function select(p){sel=sel===p?null:p;pcs.forEach(q=>q.el.classList.toggle('sel',q===sel));}
  function holeAt(cx,cy){
    for(let i=0;i<holes.length;i++){
      const r=holes[i].node.getBoundingClientRect();
      if(cx>=r.left-10&&cx<=r.right+10&&cy>=r.top-10&&cy<=r.bottom+10)return i;
    }
    return -1;
  }
  function flash(node,cls){node.classList.add(cls);setTimeout(()=>node.classList.remove(cls),350);}
  function paintHole(o){o.pips.textContent='●'.repeat(o.n)+'○'.repeat(o.need-o.n);o.node.classList.toggle('full',o.n>=o.need);}
  holes.forEach(paintHole);
  function paintStatus(){ctx.status([st('Час:',Math.max(0,Math.ceil(tLeft))+' с'),st('Помилок:',mistakes),st('Лишилось:',remaining)]);}
  function tryPlace(p,hi){
    if(done||p.done)return;
    const o=holes[hi];
    if(p.shape===o.shape&&p.color===o.color){
      if(o.n>=o.need){flash(o.node,'bad');return;}
      o.n++;p.done=true;p.el.remove();if(sel===p)sel=null;remaining--;
      paintHole(o);flash(o.node,'ok');paintStatus();
      if(remaining===0){
        done=true;cancelAnimationFrame(raf);
        setTimeout(()=>ctx.win(LOGIC.beltStars(mistakes),'Помилок: '+mistakes+', часу залишилось: '+Math.max(0,Math.ceil(tLeft))+' с'),300);
      }
    }else{
      mistakes++;flash(o.node,'bad');paintStatus();
    }
  }
  function frame(now){
    raf=requestAnimationFrame(frame);
    const dt=Math.min(0.1,(now-last)/1000);last=now;
    if(done)return;
    tLeft-=dt;shiftT+=dt;
    W=stage.clientWidth||W;
    const loopLen=Math.max(W+SIZE*2,n0*GAP),shift=shiftT*g.speed*W/400;
    for(const p of pcs){if(p.done||p.drag)continue;place(p,((p.off+shift)%loopLen)-SIZE,BELT_Y);}
    const sec=Math.ceil(tLeft);
    if(sec!==lastShown){lastShown=sec;paintStatus();}
    if(tLeft<=0){done=true;cancelAnimationFrame(raf);paintStatus();ctx.lose('Час вийшов. Залишилось фігур: '+remaining+'.');}
  }
  ctx.cleanup(()=>cancelAnimationFrame(raf));
  paintStatus();
  raf=requestAnimationFrame(frame);
};

/* ---------- words ---------- */
const UA_KEYS=['йцукенгшщзхї','фівапролджє','ячсмитьбюґ'];
const LATIN_TO_UA={q:'й',w:'ц',e:'у',r:'к',t:'е',y:'н',u:'г',i:'ш',o:'щ',p:'з','[':'х',']':'ї',a:'ф',s:'і',d:'в',f:'а',g:'п',h:'р',j:'о',k:'л',l:'д',';':'ж',"'":'є',z:'я',x:'ч',c:'с',v:'м',b:'и',n:'т',m:'ь',',':'б','.':'ю','`':'ґ'};
GAMES.word=(el,level,ctx)=>{
  const g=LOGIC.wordGen(level,S.retry),n=g.len;
  const guesses=[];let cur='',done=false;
  const board=h('div',{class:'wgrid',style:'--len:'+n}),kb=h('div',{class:'kb'}),msg=h('div',{class:'msg'});
  el.append(board,msg,kb,h('p',{class:'hint'},'Це іменник із '+n+' літер. Зелена: літера на місці. Жовта із заокругленими кутами: є в слові, але деінде. Сіра: такої літери немає. Підійде будь-який набір літер.'));
  function keyStates(){
    const m={};
    for(const x of guesses)for(let i=0;i<n;i++){const c=x.w[i];m[c]=Math.max(m[c]===undefined?-1:m[c],x.fb[i]);}
    return m;
  }
  function paint(){
    const tiles=[];
    for(let r=0;r<g.attempts;r++){
      for(let i=0;i<n;i++){
        if(r<guesses.length){const x=guesses[r];tiles.push(h('div',{class:'wt t'+x.fb[i],'aria-label':x.w[i]},x.w[i]));}
        else if(r===guesses.length&&!done)tiles.push(h('div',{class:'wt'+(cur[i]?' f':'')},cur[i]||''));
        else tiles.push(h('div',{class:'wt'}));
      }
    }
    board.replaceChildren(...tiles);
    const ks=keyStates();
    const mk=c=>h('button',{class:'key'+(ks[c]!==undefined?' k'+ks[c]:''),disabled:done,onclick:()=>add(c)},c);
    const rows=UA_KEYS.map(r=>h('div',{class:'kr'},[...r].map(mk)));
    rows[2].append(h('button',{class:'key wide','aria-label':'Стерти',disabled:done,onclick:back},'⌫'));
    kb.replaceChildren(...rows,h('div',{class:'kr'},h('button',{class:'btn primary',style:'flex:1',disabled:done,onclick:submit},'Ввести')));
    ctx.status([st('Спроба:',Math.min(guesses.length+1,g.attempts)+' / '+g.attempts),st('Літер:',n)]);
  }
  function add(c){if(done||cur.length>=n)return;cur+=c;msg.textContent='';paint();}
  function back(){if(done)return;cur=cur.slice(0,-1);paint();}
  function submit(){
    if(done)return;
    if(cur.length<n){msg.className='msg bad';msg.textContent='Потрібно літер: '+n+'.';return;}
    const fb=LOGIC.wordFeedback(g.word,cur);
    guesses.push({w:cur,fb});cur='';msg.textContent='';
    if(fb.every(v=>v===2)){done=true;paint();setTimeout(()=>ctx.win(LOGIC.wordStars(guesses.length,g.attempts),'Слово: '+g.word.toUpperCase()+'. Спроб: '+guesses.length+' із '+g.attempts),400);return;}
    if(guesses.length>=g.attempts){done=true;paint();setTimeout(()=>ctx.lose('Спроби закінчилися. Слово було: '+g.word.toUpperCase()+'.'),400);return;}
    paint();
  }
  const key=e=>{
    if(e.ctrlKey||e.metaKey||e.altKey||(e.target&&e.target.tagName==='INPUT'))return;
    if(e.key==='Enter'){if(e.target&&e.target.tagName==='BUTTON')return;e.preventDefault();submit();return;}
    if(e.key==='Backspace'){e.preventDefault();back();return;}
    const k=e.key.toLowerCase();
    const c=UA_KEYS.join('').includes(k)&&k.length===1?k:LATIN_TO_UA[k];
    if(c)add(c);
  };
  document.addEventListener('keydown',key);ctx.cleanup(()=>document.removeEventListener('keydown',key));
  paint();
};

/* ---------- word chain ---------- */
GAMES.chain=(el,level,ctx)=>{
  const g=LOGIC.chainGen(level,S.retry),N=g.words.length;
  let chain=[],undos=0,done=false;
  const chainEl=h('div',{class:'wchain'}),poolEl=h('div',{class:'wpool'}),msg=h('div',{class:'msg'});
  const undoBtn=h('button',{class:'btn',onclick:undo},'↶ Прибрати останнє слово');
  el.append(chainEl,msg,poolEl,undoBtn,h('p',{class:'hint'},'Склади ланцюжок зі всіх слів. Кожне наступне починається з літери, якою закінчується попереднє (м’який знак пропускаємо). Глухий кут не біда: прибери слово й спробуй інший порядок.'));
  function label(w){
    const li=LOGIC.chainLastIdx(w);
    return [h('b',w[0]),w.slice(1,li),li>0?h('b',w[li]):null,w.slice(li+1)];
  }
  function paint(){
    const next=chain.length?LOGIC.chainLast(chain[chain.length-1]):null;
    const items=[];
    chain.forEach((w,i)=>{if(i)items.push(h('span',{class:'ar'},'→'));items.push(h('span',{class:'wchip'},label(w)));});
    chainEl.replaceChildren(...(items.length?items:[h('span',{class:'ph'},'Обери перше слово зі списку нижче')]));
    const rest=g.words.filter(w=>!chain.includes(w));
    let fits=0;
    poolEl.replaceChildren(...rest.map(w=>{
      const ok=!next||w[0]===next;if(ok)fits++;
      return h('button',{class:'wchip','data-w':w,disabled:!ok||done,onclick:()=>take(w)},label(w));
    }));
    msg.className='msg';msg.textContent='';
    if(rest.length&&!fits){msg.className='msg bad';msg.textContent='Глухий кут: жодне слово не починається на «'+next.toUpperCase()+'». Прибери останнє слово.';}
    undoBtn.disabled=done||!chain.length;
    ctx.status([st('У ланцюжку:',chain.length+' / '+N),st(next?'Далі на літеру:':'Кроків назад:',next?next.toUpperCase():undos)]);
  }
  function take(w){
    if(done)return;
    chain.push(w);paint();
    if(chain.length===N){done=true;paint();setTimeout(()=>ctx.win(LOGIC.chainStars(undos,N),'Кроків назад: '+undos),300);}
  }
  function undo(){if(done||!chain.length)return;chain.pop();undos++;paint();}
  paint();
};

/* ---------- crossword ---------- */
GAMES.cross=(el,level,ctx)=>{
  const g=LOGIC.crossGen(level,S.retry),R=g.R,C=g.C,N=R*C,sol=g.sol;
  const val=new Array(N).fill(''),bad=new Set();
  let aids=0,done=false;
  const wat=Array.from({length:N},()=>[-1,-1]);
  const cellOf=(w,i)=>(w.r+(w.d?i:0))*C+w.c+(w.d?0:i);
  g.words.forEach((w,wi)=>{for(let i=0;i<w.len;i++)wat[cellOf(w,i)][w.d]=wi;});
  const nums={};g.words.forEach(w=>{nums[w.r*C+w.c]=w.n;});
  const total=sol.filter(Boolean).length;
  let sel={idx:cellOf(g.words[0],0),d:g.words[0].d};
  const clueEl=h('div',{class:'xclue'}),gridEl=h('div',{class:'xgrid',style:'--cols:'+C}),msg=h('div',{class:'msg'});
  const lists=h('div',{class:'xlists'});
  const kbRows=UA_KEYS.map(r=>h('div',{class:'kr'},[...r].map(c=>h('button',{class:'key',onclick:()=>put(c)},c))));
  kbRows[2].append(h('button',{class:'key wide','aria-label':'Стерти',onclick:back},'⌫'));
  el.append(clueEl,gridEl,msg,h('div',{class:'kb'},kbRows),
    h('div',{class:'row',style:'width:100%'},
      h('button',{class:'btn',onclick:check},'Перевірити'),
      h('button',{class:'btn',onclick:reveal},'Відкрити літеру')),
    lists,
    h('p',{class:'hint'},'Торкнись клітинки, щоб вибрати слово; повторний дотик змінює напрямок. Перевірка коштує одну підказку, відкрита літера — дві.'));
  const curWi=()=>{if(wat[sel.idx][sel.d]<0)sel.d=1-sel.d;return wat[sel.idx][sel.d];};
  function filled(){return val.filter((v,i)=>sol[i]&&v).length;}
  function paint(){
    const wi=curWi(),cw=g.words[wi],inw=new Set();
    for(let i=0;i<cw.len;i++)inw.add(cellOf(cw,i));
    clueEl.replaceChildren(h('b',cw.n+(cw.d?' ↓ ':' → ')),cw.clue+' ('+cw.len+')');
    gridEl.replaceChildren(...sol.map((ch,i)=>{
      if(!ch)return h('div',{class:'xc blk'});
      return h('button',{class:'xc'+(i===sel.idx?' sel':inw.has(i)?' in':'')+(bad.has(i)?' bad':''),onclick:()=>tap(i),
        'aria-label':'Клітинка '+((i/C|0)+1)+','+(i%C+1)},nums[i]?h('i',nums[i]):null,val[i]||'');
    }));
    const mk=d=>h('div',h('h3',d?'Вертикально':'Горизонтально'),h('div',{class:'xl'},
      g.words.map((w,k)=>w.d===d?h('button',{class:'xcl'+(k===wi?' cur':''),onclick:()=>pickWord(k)},h('b',w.n+'.'),w.clue+' ('+w.len+')'):null)));
    lists.replaceChildren(mk(0),mk(1));
    ctx.status([st('Заповнено:',filled()+' / '+total),st('Підказок:',aids)]);
  }
  function tap(i){
    const [a,d]=wat[i];
    if(sel.idx===i&&a>=0&&d>=0)sel.d=1-sel.d;
    else{sel.idx=i;if(sel.d===0&&a<0)sel.d=1;else if(sel.d===1&&d<0)sel.d=0;}
    paint();
  }
  function pickWord(k){
    const w=g.words[k];
    let start=cellOf(w,0);
    for(let i=0;i<w.len;i++){if(!val[cellOf(w,i)]){start=cellOf(w,i);break;}}
    sel={idx:start,d:w.d};paint();
  }
  function step(dir){
    const w=g.words[curWi()];let pos=-1;
    for(let i=0;i<w.len;i++)if(cellOf(w,i)===sel.idx)pos=i;
    const np=pos+dir;
    if(np>=0&&np<w.len){sel.idx=cellOf(w,np);return true;}
    return false;
  }
  function checkWin(){
    if(sol.every((ch,i)=>!ch||val[i]===ch)){
      done=true;paint();
      setTimeout(()=>ctx.win(LOGIC.crossStars(aids),'Підказок: '+aids),300);
    }
  }
  function put(ch){
    if(done)return;
    val[sel.idx]=ch;bad.delete(sel.idx);msg.textContent='';
    step(1);paint();checkWin();
  }
  function back(){
    if(done)return;
    if(val[sel.idx]){val[sel.idx]='';bad.delete(sel.idx);}
    else if(step(-1)){val[sel.idx]='';bad.delete(sel.idx);}
    paint();
  }
  function check(){
    if(done)return;
    aids++;bad.clear();
    for(let i=0;i<N;i++)if(val[i]&&val[i]!==sol[i])bad.add(i);
    msg.className='msg '+(bad.size?'bad':'good');
    msg.textContent=bad.size?'Помилок у сітці: '+bad.size+'. Вони виділені червоним.':'Усе введене поки що правильно.';
    paint();
  }
  function reveal(){
    if(done)return;
    aids+=2;val[sel.idx]=sol[sel.idx];bad.delete(sel.idx);msg.textContent='';
    step(1);paint();checkWin();
  }
  const key=e=>{
    if(e.ctrlKey||e.metaKey||e.altKey||(e.target&&e.target.tagName==='INPUT'))return;
    if(e.key==='Backspace'){e.preventDefault();back();return;}
    if(e.key===' '){e.preventDefault();sel.d=1-sel.d;paint();return;}
    const k=e.key.toLowerCase();
    const c=k.length===1&&UA_KEYS.join('').includes(k)?k:LATIN_TO_UA[k];
    if(c)put(c);
  };
  document.addEventListener('keydown',key);ctx.cleanup(()=>document.removeEventListener('keydown',key));
  paint();
};

  const dbDone=initDb();
