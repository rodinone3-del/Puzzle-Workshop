    }else if(t.k==='coil'){
      const rc=RELAY_COL[t.id%2],act=I>=0.1;
      o=leads(col)+'<rect x="-13" y="-15" width="26" height="30" rx="5" style="fill:'+(act?rc:'var(--panel2)')+'" stroke="rgb(0 0 0 / .45)" stroke-width="2.5"/>'+
        '<path d="M-6 -10h12M-6 -4h12M-6 2h12M-6 8h12" stroke="rgb(0 0 0 / .45)" stroke-width="2.2" stroke-linecap="round"/>'+
        '<g transform="translate(19 0)">'+un+'<text text-anchor="middle" y="4" font-size="11" font-weight="700" style="fill:'+rc+'">K'+(t.id+1)+'</text></g></g>';
    }else if(t.k==='dio'){
      const cond=ev.dioOn[i]&&ev.I[i]>0.03;
      o=leads(col)+'<polygon points="-10,-10 10,-10 0,9" style="fill:'+(cond?'var(--lamp)':'var(--panel2)')+'" stroke="rgb(0 0 0 / .5)" stroke-width="2.5" stroke-linejoin="round"/><line x1="-11" y1="11" x2="11" y2="11" style="stroke:var(--ink)" stroke-width="4" stroke-linecap="round"/>';
    }
    return o;
  }
  function paint(){
    const {ok,ev}=LOGIC.circWin(R,C,T);
    const short=ev.short;
    let o='<svg class="csvg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Макетна плата"><defs><pattern id="hp" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1.7" style="fill:var(--line)"/></pattern></defs>';
    o+='<rect width="'+W+'" height="'+H+'" rx="12" style="fill:color-mix(in srgb,var(--c3) 9%,var(--panel2))" stroke="var(--line)" stroke-width="2"/>';
    o+='<rect x="'+CPX+'" y="'+CPY+'" width="'+(W-CPX*2)+'" height="'+(H-CPY*2)+'" fill="url(#hp)"/>';
    o+='<line x1="'+CPX+'" y1="'+(H/2)+'" x2="'+(W-CPX)+'" y2="'+(H/2)+'" style="stroke:var(--line)" stroke-width="3" opacity=".6"/>';
    for(const [y,c,sym] of [[7,'var(--c0)','+'],[H-7,'var(--c1)','−']]){
      o+='<line x1="'+CPX+'" y1="'+y+'" x2="'+(W-CPX)+'" y2="'+y+'" style="stroke:'+c+'" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/><text x="4" y="'+(y+4)+'" font-size="11" font-weight="700" style="fill:'+c+'">'+sym+'</text>';
    }
    for(let i=0;i<R*C;i++){
      const t=T[i];if(t.k==='e')continue;
      const x=cx(i),y=cy(i),ports=LOGIC.circPorts(t);
      let powered=false;for(let d=0;d<4;d++)if(Math.abs(ev.flow[i*4+d])>0.03)powered=true;
      const col=wireStyle(powered,short);
      let body;
      if(t.k==='w'){
        body=ports.map(d=>wire(0,0,CMID[d][0],CMID[d][1],col)).join('');
        if(ports.length>=3)body+='<circle r="7" style="fill:'+col+'" stroke="rgb(0 0 0 / .35)" stroke-width="2"/>';
        o+='<g transform="translate('+x+' '+y+')">'+body+'</g>';
      }else{
        o+='<g transform="translate('+x+' '+y+') rotate('+((t.r||0)*90)+')">'+deviceBody(t,i,ev,col)+'</g>';
      }
      let ov='';
      for(let d=0;d<4;d++){
        const f=ev.flow[i*4+d];if(Math.abs(f)<=0.03)continue;
        const [mx,my]=CMID[d];
        ov+=f>0?'<line x1="0" y1="0" x2="'+mx+'" y2="'+my+'" class="cflow" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>'
               :'<line x1="'+mx+'" y1="'+my+'" x2="0" y2="0" class="cflow" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>';
      }
      if(ov)o+='<g transform="translate('+x+' '+y+')">'+ov+'</g>';
      if(short&&t.k==='bat')o+='<g transform="translate('+x+' '+y+')" class="cspark"><polygon points="0,-30 5,-12 22,-18 10,-4 26,6 8,8 12,26 0,12 -12,26 -8,8 -26,6 -10,-4 -22,-18 -5,-12" style="fill:var(--lamp)" stroke="var(--bad)" stroke-width="2"/></g>';
      if(circLoadT(t)){
        const lit=ev.lit[i],okk=lit===!!t.want;
        o+='<g transform="translate('+(x+13)+' '+(y-30)+')"><rect x="0" y="-8" width="25" height="15" rx="7.5" style="fill:'+(okk?'var(--good)':'var(--panel)')+'" stroke="'+(okk?'none':'var(--line)')+'" stroke-width="1.5"/><text x="12.5" y="3" text-anchor="middle" font-size="9" font-weight="700" font-family="IBM Plex Mono,monospace" style="fill:'+(okk?'var(--accent-ink)':'var(--mute)')+'">'+(t.want?'ON':'OFF')+'</text></g>';
      }
      if(i===hl)o+='<rect x="'+(x-30)+'" y="'+(y-30)+'" width="60" height="60" rx="10" fill="none" style="stroke:var(--brass)" stroke-width="4" stroke-dasharray="8 5"/>';
    }
    for(let i=0;i<R*C;i++)o+='<rect data-i="'+i+'" x="'+(cx(i)-CGU/2)+'" y="'+(cy(i)-CGU/2)+'" width="'+CGU+'" height="'+CGU+'" fill="transparent"/>';
    o+='</svg>';
    wrap.innerHTML=o;
    goals.replaceChildren(...T.map((t,i)=>circLoadT(t)?h('span',{class:'cgoal'+(ev.lit[i]===!!t.want?' ok':'')},NAME[t.k]+': '+(t.want?(t.k==='buz'?'має сигналити':'має світити'):(t.k==='buz'?'має мовчати':'має не світити'))):null).filter(Boolean));
    const nl=T.filter(circLoadT).length,good=T.filter((t,i)=>circLoadT(t)&&ev.lit[i]===!!t.want).length;
    ctx.status([st('Цілі:',good+' / '+nl),st('Ходи:',moves+' / '+g.par)]);
    if(done){msg.className='msg good';msg.textContent='Схема працює!';}
    else if(short){msg.className='msg bad';msg.textContent='Коротке замикання! Струм іде повз навантаження, розірви цей шлях.';}
    else if(ev.unstable){msg.className='msg bad';msg.textContent='Схема нестабільна: реле «хитається».';}
    else if(!ev.hasBat||ev.Ib<0.02){msg.className='msg';msg.textContent='Струм не тече: коло від батареї розімкнене.';}
    else msg.textContent='';
    const key=T.map((t,i)=>circLoadT(t)?(ev.lit[i]?1:0):'').join('');
    if(short&&!lastShort)SND.play('spark');
    if(lastLit!==null&&key!==lastLit){
      const newOn=T.some((t,i)=>circLoadT(t)&&ev.lit[i]&&lastLit[i]==='0');
      if(newOn)SND.play(T.some((t,i)=>t.k==='buz'&&ev.lit[i]&&lastLit[i]==='0')?'buzz':'good');
    }
    lastLit=key;lastShort=short;
    if(ok&&!done){done=true;paint();setTimeout(()=>ctx.win(LOGIC.circStars(moves,g.par),'Ходів: '+moves+', орієнтир '+g.par),1100);}
  }
  function circLoadT(t){return t.k==='lamp'||t.k==='buz';}
  wrap.addEventListener('click',e=>{
    if(done)return;
    const t=e.target.closest&&e.target.closest('[data-i]');if(!t)return;
    const i=+t.getAttribute('data-i'),tile=T[i];
    hl=-1;
    if(tile.k==='sw'){tile.on=!tile.on;moves++;SND.play('click');paint();}
    else if(LOGIC.circRotatable(tile)){tile.r=(tile.r+1)%4;moves++;SND.play('rot');paint();}
    else if(tile.k!=='e'){
      msg.className='msg';msg.textContent=tile.k==='bat'?'Батарея стоїть на місці. Плюс позначено знаком «+».':tile.k==='ctc'?'Контакт реле замикається сам, коли тече струм через котушку K'+(tile.id+1)+'.':'Цю деталь не можна рухати.';
    }
  });
  ctx.setHint(()=>{
    if(done)return'Рівень уже пройдено.';
    for(let i=0;i<T.length;i++){
      const t=T[i],s=g.sol[i];
      const bad=(LOGIC.circRotatable(t)&&LOGIC.circSteps(t,s)>0)||(t.k==='sw'&&t.on!==s.on);
      if(bad){hl=i;paint();msg.className='msg';msg.textContent=t.k==='sw'?'Підказка: перемкни підсвічений перемикач.':'Підказка: поверни підсвічену деталь.';return true;}
    }
    return'Усі деталі вже на місці.';
  });
  paint();
};
/* ---------- keyboard assist: preview bubble, slide-to-correct, commit on release ---------- */
(function(){
  const SEL='.key,.numpad .btn';
  let bub=null,cur=null,pid=null,hideT=0;
  const keyAt=(x,y)=>{const e=document.elementFromPoint(x,y);const k=e&&e.closest&&e.closest(SEL);return k&&!k.disabled?k:null;};
  function show(k){
    if(cur&&cur!==k)cur.classList.remove('prs');
    cur=k;if(!k){if(bub)bub.style.display='none';return;}
    k.classList.add('prs');
    if(!bub){bub=document.createElement('div');bub.className='kbub';bub.setAttribute('aria-hidden','true');document.body.append(bub);}
    clearTimeout(hideT);
    const r=k.getBoundingClientRect();
    bub.textContent=k.getAttribute('aria-label')==='Стерти'?'⌫':k.textContent;
    bub.style.display='block';bub.style.opacity='1';
    const w=Math.max(52,r.width+16);
    bub.style.width=w+'px';
    bub.style.left=Math.max(4,Math.min(innerWidth-w-4,r.left+r.width/2-w/2))+'px';
    bub.style.top=Math.max(4,r.top-62)+'px';
  }
  function finish(commit){
    const k=cur;pid=null;
    if(bub){const b=bub;hideT=setTimeout(()=>{b.style.opacity='0';setTimeout(()=>{if(!cur)b.style.display='none';},120);},140);}
    if(k){setTimeout(()=>k.classList.remove('prs'),commit?220:0);if(commit)k.click();}
    cur=null;
  }
  document.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    const k=keyAt(e.clientX,e.clientY);if(!k)return;
    pid=e.pointerId;try{k.releasePointerCapture(e.pointerId);}catch(_){}
    show(k);
  },{passive:true});
  document.addEventListener('pointermove',e=>{
    if(pid!==e.pointerId)return;
    const k=keyAt(e.clientX,e.clientY);
    if(k!==cur)show(k);
  },{passive:true});
  document.addEventListener('pointerup',e=>{
    if(pid!==e.pointerId)return;
    const k=keyAt(e.clientX,e.clientY);
    if(k&&k!==cur)show(k);
    finish(!!k);
  },{passive:true});
  document.addEventListener('pointercancel',e=>{if(pid===e.pointerId)finish(false);},{passive:true});
  /* real taps are committed on release above; swallow the browser's own click, keep keyboard (detail 0) and programmatic clicks */
  document.addEventListener('click',e=>{
    if(e.isTrusted&&e.detail>0&&e.target.closest&&e.target.closest(SEL)){e.stopPropagation();e.preventDefault();}
  },true);
})();

/* ---------- boot ---------- */
document.addEventListener('selectstart',e=>{const t=e.target&&e.target.nodeType===1?e.target:e.target&&e.target.parentElement;if(!t||!t.closest('input,textarea'))e.preventDefault();});
document.addEventListener('dblclick',e=>{if(!(e.target.closest&&e.target.closest('input,textarea')))e.preventDefault();});
let HAD_SAVE=false;try{HAD_SAVE=localStorage.getItem(LS)!==null;}catch(e){}
if(!HAD_SAVE&&!getSeen())setSeen(VERSION);
loadLocal();loadSettings();
const unlock=()=>{if(S.set.sound)SND.ensure();};
document.addEventListener('pointerdown',unlock,{passive:true});
document.addEventListener('keydown',unlock,{passive:true});
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest&&e.target.closest('button');
  if(!b||b.disabled)return;
  const nm=b.dataset.snd||'click';
  if(nm!=='none')SND.play(nm);
},{passive:true});
render();
(async()=>{
  const dbDone=initDb();
  await Promise.race([dbDone,new Promise(r=>setTimeout(r,3000))]);
  if(!S.name)askName(false);
  await dbDone;
  if(S.name&&S.nameDlg&&S.nameOpen&&S.nameDlg.querySelector('h2').textContent==='Ласкаво просимо'){S.nameDlg.remove();S.nameOpen=false;}
  render();
  if(S.name&&!S.nameOpen)maybeShowNews(HAD_SAVE);
})();
</script>
